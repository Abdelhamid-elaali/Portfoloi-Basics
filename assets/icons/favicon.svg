<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Stylized Monogram AE -->
  <path d="M 28 72 L 44 26 L 60 72 M 34 56 L 54 56" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 58 38 L 74 38 M 58 50 L 70 50 M 58 62 L 74 62" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="75" cy="27" r="3.5" fill="#06b6d4" filter="url(#glow)"/>
</svg>
