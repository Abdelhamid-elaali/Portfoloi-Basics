<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Introuvable | Abdelhamid El Aali</title>
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico">
  
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/sections.css">
  <link rel="stylesheet" href="./css/animations.css">

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('site_theme');
        if (theme === 'light' || (!theme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">

  <div class="card-glass" style="max-width: 580px; width: 100%; text-align: center; padding: clamp(2rem, 1.5rem + 2.5vw, 3.5rem);">
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: var(--radius-lg); background: rgba(99,102,241,0.12); border: 1px solid var(--border-accent); color: var(--accent-secondary); margin-bottom: var(--space-lg);">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    </div>

    <h1 style="font-size: clamp(3rem, 2.5rem + 3vw, 5rem); line-height: 1; margin-bottom: var(--space-xs);" class="gradient-text">404</h1>
    <h2 style="font-size: var(--text-2xl); margin-bottom: var(--space-sm);">Page Introuvable / Page Not Found</h2>
    
    <p style="color: var(--text-secondary); margin-bottom: var(--space-xl); margin-left: auto; margin-right: auto;">
      La page demandée n'existe pas ou a été déplacée.<br>
      <em>The requested page does not exist or has been moved.</em>
    </p>

    <div style="display: flex; justify-content: center; gap: var(--space-md); flex-wrap: wrap;">
      <a href="./index.html" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Retour à l'accueil / Back Home</span>
      </a>
    </div>
  </div>

</body>
</html>
